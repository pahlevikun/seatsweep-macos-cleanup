<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 256" width="904" height="256" fill="none" role="img" aria-label="seatsweep, This Mac account, minus the leftovers. Scan first. iCloud stays.">
  <defs>
    <style>
      .cursor-block {
        animation: cursor-blink 1.1s steps(2, start) infinite;
      }
      .pan-draw {
        stroke-dasharray: 460;
        stroke-dashoffset: 460;
        animation: pan-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .lip-draw {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: lip-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .key-draw {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: key-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .cloud-draw {
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: cloud-draw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .row-a { animation: row-a 6s ease-in-out infinite; }
      .row-b { animation: row-b 6s ease-in-out infinite; }
      .row-c { animation: row-c 6s ease-in-out infinite; }
      .exclude-row { animation: exclude-in 6s ease-in-out infinite; }
      .stage-scan { animation: pulse-scan 6s ease-in-out infinite; }
      .stage-list { animation: pulse-list 6s ease-in-out infinite; }
      .stage-wait { animation: pulse-wait 6s ease-in-out infinite; }
      .pick-pill {
        transform-origin: 238px 196px;
        animation: pick-in 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes cursor-blink {
        0%, 49% { opacity: 0.9; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes pan-draw {
        0%, 4% { stroke-dashoffset: 460; }
        18%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 460; }
      }
      @keyframes lip-draw {
        0%, 12% { stroke-dashoffset: 200; }
        28%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 200; }
      }
      @keyframes key-draw {
        0%, 24% { stroke-dashoffset: 260; }
        42%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 260; }
      }
      @keyframes cloud-draw {
        0%, 28% { stroke-dashoffset: 520; }
        46%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 520; }
      }
      @keyframes row-a {
        0%, 8% { opacity: 0.35; }
        20%, 88% { opacity: 1; }
        96%, 100% { opacity: 0.35; }
      }
      @keyframes row-b {
        0%, 14% { opacity: 0.35; }
        28%, 88% { opacity: 1; }
        96%, 100% { opacity: 0.35; }
      }
      @keyframes row-c {
        0%, 20% { opacity: 0.35; }
        36%, 88% { opacity: 1; }
        96%, 100% { opacity: 0.35; }
      }
      @keyframes exclude-in {
        0%, 32% { opacity: 0.4; }
        48%, 88% { opacity: 1; }
        96%, 100% { opacity: 0.4; }
      }
      @keyframes pulse-scan {
        0%, 18% { fill: #4285F4; }
        22%, 100% { fill: #5F6368; }
      }
      @keyframes pulse-list {
        0%, 16% { fill: #9AA0A6; }
        18%, 40% { fill: #4285F4; }
        44%, 100% { fill: #5F6368; }
      }
      @keyframes pulse-wait {
        0%, 38% { fill: #9AA0A6; }
        42%, 64% { fill: #4285F4; }
        68%, 100% { fill: #5F6368; }
      }
      @keyframes pick-in {
        0%, 54% { opacity: 0.35; transform: scale(0.98); }
        64%, 88% { opacity: 1; transform: scale(1); }
        96%, 100% { opacity: 0.35; transform: scale(0.98); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor-block, .pan-draw, .lip-draw, .key-draw, .cloud-draw,
        .row-a, .row-b, .row-c, .exclude-row, .pick-pill,
        .stage-scan, .stage-list, .stage-wait {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <rect x="2" y="2" width="900" height="252" rx="18" fill="#F8F9FA" stroke="#DADCE0" stroke-width="2"/>

  <g transform="translate(28, 60)">
    <rect x="0" y="0" width="136" height="136" rx="32" fill="#FFFFFF" stroke="#DADCE0" stroke-width="2"/>
    <g transform="translate(8, 8) scale(0.3)">
      <path class="pan-draw" d="M 72 108 L 104 128 L 104 292 L 246 292" fill="none" stroke="#3C4043" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="lip-draw" d="M 228 292 C 266 292 286 264 294 228" fill="none" stroke="#FBBC04" stroke-width="26" stroke-linecap="round"/>
      <path class="key-draw" d="M 334 250 A 14 14 0 1 1 362 250 A 14 14 0 1 1 334 250 M 362 250 L 396 250 M 380 250 L 380 266 M 392 250 L 392 260" fill="none" stroke="#5F6368" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="cloud-draw" d="M 328 150 C 328 126 352 118 368 134 C 380 116 414 122 412 146 C 432 150 428 178 404 180 L 352 180 C 326 180 318 164 328 150 Z" fill="#E8F0FE" stroke="#5F6368" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="184" y="100" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.6"><tspan fill="#202124">seat</tspan><tspan fill="#4285F4">sweep</tspan></text>
  <rect class="cursor-block" x="382" y="74" width="10" height="7" rx="2" fill="#4285F4" opacity="0.92"/>
  <rect class="cursor-block" x="382" y="81" width="10" height="7" rx="2" fill="#EA4335" opacity="0.92"/>
  <rect class="cursor-block" x="382" y="88" width="10" height="7" rx="2" fill="#FBBC04" opacity="0.92"/>
  <rect class="cursor-block" x="382" y="95" width="10" height="7" rx="2" fill="#34A853" opacity="0.92"/>

  <text x="186" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#5F6368">This Mac account,</text>
  <text x="186" y="142" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#5F6368">minus the leftovers.</text>
  <text x="186" y="160" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#5F6368">Scan first. iCloud stays.</text>

  <g transform="translate(186, 172)" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
    <rect x="0" y="0" width="104" height="26" rx="6" fill="#F1F3F4" stroke="#FBBC04" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="3.5" fill="#EA4335"/>
    <text x="24" y="17" fill="#202124">scan first</text>
    <rect x="112" y="0" width="119" height="26" rx="6" fill="#F1F3F4" stroke="#34A853" stroke-width="1.2"/>
    <text x="128" y="17" fill="#5F6368">iCloud stays</text>
  </g>

  <text x="186" y="220" font-family="IBM Plex Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" fill="#80868B">A dustpan with a keep list.</text>

  <g transform="translate(456, 22)">
    <rect x="0" y="0" width="424" height="212" rx="12" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1.5"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 H 412 A 12 12 0 0 1 424 12 V 36 H 0 Z" fill="#F1F3F4"/>
    <line x1="0" y1="36" x2="424" y2="36" stroke="#DADCE0" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="4" fill="#EA4335" />
    <circle cx="30" cy="18" r="4" fill="#FBBC04"/>
    <circle cx="44" cy="18" r="4" fill="#34A853"/>
    <rect x="62" y="8" width="118" height="20" rx="5" fill="#FFFFFF" stroke="#4285F4" stroke-width="1"/>
    <circle cx="73" cy="18" r="3" fill="#4285F4"/>
    <text x="82" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" fill="#4285F4">scan $HOME</text>
    <text x="340" y="22" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5F6368">dry run</text>

    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <g class="row-a">
        <text x="18" y="58" fill="#202124" font-weight="600">Browser data</text>
        <text x="330" y="58" fill="#5F6368">1.2G</text>
      </g>
      <g class="row-b">
        <text x="18" y="78" fill="#202124" font-weight="600">OS caches</text>
        <text x="330" y="78" fill="#5F6368">640M</text>
      </g>
      <g class="row-c">
        <text x="18" y="98" fill="#202124" font-weight="600">Homebrew unused</text>
        <text x="330" y="98" fill="#5F6368">96M</text>
      </g>
      <g class="exclude-row">
        <rect x="10" y="108" width="404" height="26" rx="6" fill="#FFFFFF" stroke="#4285F4" stroke-width="1.2"/>
        <text x="20" y="125" fill="#4285F4" font-weight="600">EXCLUDE keep</text>
        <text x="300" y="125" fill="#202124">iCloud</text>
      </g>
      <text x="18" y="156" fill="#5F6368">waiting for a category pick</text>
    </g>

    <line x1="0" y1="180" x2="424" y2="180" stroke="#DADCE0" stroke-width="1.2"/>
    <g font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">
      <text class="stage-scan" x="16" y="200" fill="#5F6368">scan</text>
      <text x="52" y="200" fill="#DADCE0">&#8594;</text>
      <text class="stage-list" x="68" y="200" fill="#5F6368">list</text>
      <text x="98" y="200" fill="#DADCE0">&#8594;</text>
      <text class="stage-wait" x="114" y="200" fill="#5F6368">wait</text>
      <g class="pick-pill">
        <rect x="168" y="186" width="140" height="20" rx="4" fill="#FFFFFF" stroke="#4285F4" stroke-width="1"/>
        <text x="180" y="200" fill="#4285F4">your category</text>
      </g>
    </g>
  </g>
</svg>
