<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="seatsweep icon">
  <defs>
    <style>
      .pan-draw {
        stroke-dasharray: 460;
        stroke-dashoffset: 460;
        animation: pan-draw 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .lip-draw {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: lip-draw 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .key-draw {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: key-draw 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .cloud-draw {
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: cloud-draw 4.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes pan-draw {
        0%, 6% { stroke-dashoffset: 460; }
        28%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 460; }
      }
      @keyframes lip-draw {
        0%, 16% { stroke-dashoffset: 200; }
        40%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 200; }
      }
      @keyframes key-draw {
        0%, 36% { stroke-dashoffset: 260; }
        58%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 260; }
      }
      @keyframes cloud-draw {
        0%, 40% { stroke-dashoffset: 520; }
        62%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 520; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pan-draw, .lip-draw, .key-draw, .cloud-draw {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#17152e" stroke="#3a3358" stroke-width="6"/>
  <g transform="translate(56, 56)">
    <path class="pan-draw" d="M 72 108 L 104 128 L 104 292 L 246 292" fill="none" stroke="#e8e4f4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="lip-draw" d="M 228 292 C 266 292 286 264 294 228" fill="none" stroke="#c99d48" stroke-width="26" stroke-linecap="round"/>
    <path class="key-draw" d="M 334 250 A 14 14 0 1 1 362 250 A 14 14 0 1 1 334 250 M 362 250 L 396 250 M 380 250 L 380 266 M 392 250 L 392 260" fill="none" stroke="#98a2b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="cloud-draw" d="M 328 150 C 328 126 352 118 368 134 C 380 116 414 122 412 146 C 432 150 428 178 404 180 L 352 180 C 326 180 318 164 328 150 Z" fill="#4a4f7a" stroke="#98a2b6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
