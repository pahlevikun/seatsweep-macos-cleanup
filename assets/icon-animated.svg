<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="seatsweep icon, cloud and key stay">
  <defs>
    <style>
      .cloud-draw {
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: cloud-draw 4.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .key-draw {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: key-draw 4.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes cloud-draw {
        0%, 8% { stroke-dashoffset: 520; }
        36%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 520; }
      }
      @keyframes key-draw {
        0%, 28% { stroke-dashoffset: 320; }
        52%, 88% { stroke-dashoffset: 0; }
        96%, 100% { stroke-dashoffset: 320; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cloud-draw, .key-draw {
          animation: none !important;
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#F8F9FA" stroke="#DADCE0" stroke-width="6"/>
  <g transform="translate(56, 56)">
    <path class="cloud-draw" d="M 204 100 C 168 100 144 130 158 154 C 128 162 122 198 152 214 C 170 254 228 244 244 210 C 282 210 298 174 274 152 C 280 116 238 94 204 100 Z" fill="#DDF3E8" stroke="#8FD4A8" stroke-width="12" stroke-linejoin="round"/>
    <circle class="key-draw" cx="204" cy="292" r="36" fill="#FFFFFF" stroke="#93B8F5" stroke-width="12"/>
    <path class="key-draw" d="M 204 328 L 204 368 L 280 368 L 280 344" fill="none" stroke="#93B8F5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="204" cy="292" r="14" fill="#D6E8FF"/>
  </g>
</svg>
